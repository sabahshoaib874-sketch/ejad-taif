<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#eaf2f7">
<title>منصة إيجاد الرقمية | الكلية التقنية بالطائف</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"Segoe UI",Tahoma,sans-serif}
:root{
  --main:#174f78;--blue:#315f85;
  --body-bg:linear-gradient(135deg,#eaf2f7,#dce8f0,#edf4f8);
  --nav-bg:rgba(238,246,251,.73);
  --nav-border:rgba(255,255,255,.7);
  --glass-card:rgba(255,255,255,.57);
  --glass-card-hover:rgba(255,255,255,.78);
  --glass-panel:rgba(255,255,255,.65);
  --glass-sub:rgba(255,255,255,.52);
  --glass-border:rgba(255,255,255,.85);
  --icon-circle:rgba(222,235,245,.65);
  --text:#315b7d;--muted:#718ba3;--logo-title:#263f55;
  --input-bg:rgba(255,255,255,.65);--input-border:rgba(180,205,225,.55);
  --side-bg:rgba(237,245,250,.85);
  --shadow:rgba(48,75,100,.08);
}

/* ألوان الوضع الليلي */
body.dark-mode{
  --main:#63b3ed;--blue:#4299e1;
  --body-bg:linear-gradient(135deg,#0b1520,#112030,#0d1926);
  --nav-bg:rgba(15,28,42,.78);
  --nav-border:rgba(255,255,255,.12);
  --glass-card:rgba(22,38,56,.62);
  --glass-card-hover:rgba(30,50,74,.82);
  --glass-panel:rgba(20,35,52,.72);
  --glass-sub:rgba(255,255,255,.06);
  --glass-border:rgba(255,255,255,.14);
  --icon-circle:rgba(45,75,105,.45);
  --text:#e2e8f0;--muted:#94a3b8;--logo-title:#f1f5f9;
  --input-bg:rgba(15,28,42,.75);--input-border:rgba(255,255,255,.18);
  --side-bg:rgba(15,28,42,.92);
  --shadow:rgba(0,0,0,.35);
}

body{background:var(--body-bg);color:var(--text);min-height:100vh;padding-bottom:30px;transition:background .35s ease,color .35s ease}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid #3985cf;outline-offset:3px}

/* الشريط العلوي */
.nav-glass{
  min-height:82px;width:100%;position:sticky;top:0;z-index:1000;
  display:flex;align-items:center;justify-content:space-between;gap:16px;padding:10px 22px;
  background:var(--nav-bg);backdrop-filter:blur(25px) saturate(160%);
  -webkit-backdrop-filter:blur(25px) saturate(160%);
  border-bottom:1px solid var(--nav-border);box-shadow:0 8px 30px var(--shadow);
  transition:background .35s ease
}
.logo-box{display:flex;align-items:center;gap:12px;flex-shrink:0;padding:8px 13px;
  background:var(--glass-sub);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border:1px solid var(--glass-border);border-radius:15px;cursor:pointer;
  box-shadow:0 5px 18px var(--shadow)}
.logo-box svg{width:36px;height:36px}
.logo-text{display:flex;flex-direction:column;text-align:right;gap:2px}
.logo-text strong{color:var(--logo-title);font-size:15px;white-space:nowrap}
.logo-text span{font-size:10px;color:var(--muted);direction:ltr;text-align:right}
.search-wrapper{flex:1;max-width:480px;height:49px;display:flex;align-items:center;gap:10px;
  background:var(--glass-sub);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border:1px solid var(--glass-border);border-radius:30px;padding:0 17px;
  box-shadow:0 6px 18px var(--shadow)}
.search-wrapper svg{width:21px;height:21px;color:var(--main);flex-shrink:0;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.search-wrapper input{border:none;outline:none;width:100%;background:transparent;font-size:14px;color:var(--text)}
.search-wrapper input::placeholder{color:var(--muted);opacity:1}
.nav-actions{display:flex;align-items:center;gap:8px;flex-shrink:0}
.nav-icon{width:46px;height:46px;display:grid;place-items:center;position:relative;
  background:var(--glass-sub);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border:1px solid var(--glass-border);border-radius:13px;color:var(--main);
  box-shadow:0 5px 15px var(--shadow);transition:all .25s ease}
.nav-icon:hover{background:var(--glass-card-hover);transform:translateY(-2px)}
.nav-icon svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.notification-dot{position:absolute;width:8px;height:8px;background:#3985cf;border-radius:50%;top:9px;left:10px}

/* القائمة الجانبية الزجاجية */
.sidebar-overlay{position:fixed;inset:0;z-index:1999;background:rgba(15,25,38,.35);
  backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);display:none}
.sidebar-overlay.show{display:block}
.side-menu{position:fixed;top:0;right:-310px;width:300px;height:100dvh;z-index:2000;
  background:var(--side-bg);backdrop-filter:blur(30px) saturate(150%);
  -webkit-backdrop-filter:blur(30px) saturate(150%);border-left:1px solid var(--glass-border);
  box-shadow:-10px 0 35px var(--shadow);transition:right .32s ease;display:flex;flex-direction:column}
.side-menu.open{right:0}
.side-header{height:82px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;
  background:var(--glass-sub);border-bottom:1px solid var(--glass-border)}
.side-header h3{font-size:20px;color:var(--main)}
.close-menu{border:0;background:transparent;color:var(--main);font-size:27px}
.side-links{list-style:none;overflow-y:auto}
.side-links li{min-height:60px;padding:18px 23px;color:var(--text);font-size:16px;font-weight:600;
  border-bottom:1px solid var(--glass-border);cursor:pointer;transition:all .25s ease}
.side-links li:hover{background:var(--glass-sub);padding-right:29px;color:var(--main)}

/* الواجهة وصورة المبنى */
.hero{position:relative;height:350px;
  background:linear-gradient(rgba(20,45,68,.55),rgba(18,40,62,.65)),
  url("building.JPG") center/cover no-repeat,linear-gradient(135deg,#607f99,#385b79);
  display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;
  padding:25px;color:white;transition:height .3s;box-shadow:inset 0 0 50px rgba(0,0,0,.18)}
body.dark-mode .hero{
  background:linear-gradient(rgba(10,22,36,.72),rgba(10,22,36,.82)),
  url("building.JPG") center/cover no-repeat,linear-gradient(135deg,#1e3246,#0f1c2a);
}
.hero.compact{height:175px;border-bottom:4px solid var(--main)}
.hero h1{font-size:2rem;margin-bottom:12px;text-shadow:0 2px 12px rgba(0,0,0,.35)}
.hero p{font-size:17px;color:#e2e8f0;line-height:1.9;text-shadow:0 2px 12px rgba(0,0,0,.35)}

/* حركة أيقونة السهم */
.scroll-arrow{
  position:absolute;bottom:14px;font-size:24px;color:#ffffff;opacity:.92;
  cursor:pointer;user-select:none;padding:6px 12px;
  animation:bounceArrow 1.7s infinite ease-in-out;
  text-shadow:0 2px 8px rgba(0,0,0,.4)
}
.hero.compact .scroll-arrow{display:none}
@keyframes bounceArrow{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(9px)}
}

/* بطاقات الخدمات */
.services-list{width:min(1015px,calc(100% - 32px));margin:32px auto;display:flex;flex-direction:column;gap:18px}
.service-card{min-height:139px;width:100%;background:var(--glass-card);
  backdrop-filter:blur(22px) saturate(150%);-webkit-backdrop-filter:blur(22px) saturate(150%);
  border-radius:24px;padding:23px 27px;display:flex;align-items:center;gap:22px;
  border:1px solid var(--glass-border);
  box-shadow:0 8px 28px var(--shadow),inset 0 1px 0 rgba(255,255,255,.25);
  cursor:pointer;transition:all .25s ease}
.service-card:hover{transform:translateY(-3px);background:var(--glass-card-hover);box-shadow:0 12px 32px var(--shadow)}
.icon-circle{width:80px;height:80px;min-width:80px;border-radius:22px;background:var(--icon-circle);
  backdrop-filter:blur(15px);-webkit-backdrop-filter:blur(15px);display:grid;place-items:center;
  color:var(--main);border:1px solid var(--glass-border)}
.icon-circle svg{width:33px;height:33px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.service-text{flex:1;text-align:right}
.service-text h3{color:var(--main);font-size:21px;margin-bottom:9px}
.service-text p{color:var(--muted);font-size:16px;line-height:1.7}

/* الصفحات الداخلية */
.view-container{display:none;max-width:850px;margin:35px auto;padding:0 17px}
.card-panel{background:var(--glass-panel);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
  padding:27px;border-radius:22px;border:1px solid var(--glass-border);
  box-shadow:0 10px 30px var(--shadow);border-top:4px solid var(--main)}
.panel-header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-bottom:17px;margin-bottom:23px;border-bottom:1px solid var(--glass-border)}
.panel-header h2{color:var(--main);font-size:22px}
.btn-back{background:var(--icon-circle);border:1px solid var(--glass-border);color:var(--main);border-radius:10px;padding:10px 16px;font-weight:bold;transition:all .2s ease}
.btn-back:hover{background:var(--glass-card-hover)}
.form-group{margin-bottom:18px}
.form-group label{display:block;margin-bottom:8px;font-weight:600;color:var(--main)}
.form-group input,.form-group textarea,.form-group select{width:100%;padding:13px;border:1px solid var(--input-border);border-radius:11px;background:var(--input-bg);outline:none;font-size:15px;color:var(--text)}
.form-group input:focus,.form-group textarea:focus,.form-group select:focus{border-color:var(--main)}
.btn-submit{background:#174f78;color:white;border:1px solid rgba(255,255,255,.25);border-radius:11px;width:100%;padding:14px;font-weight:bold;font-size:16px;box-shadow:0 5px 15px var(--shadow);transition:background .2s}
.btn-submit:hover{background:#1f6396}
.item-card{background:var(--glass-sub);border:1px solid var(--glass-border);padding:17px;border-radius:14px;margin-bottom:13px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.item-card h3{color:var(--main);margin-bottom:8px}
.item-card p{color:var(--muted);line-height:1.8;font-size:14px}
.status{display:inline-block;background:rgba(16,185,129,.18);color:#10b981;padding:5px 12px;border-radius:20px;font-size:12px;font-weight:600;margin-top:7px}
.empty{text-align:center;color:var(--muted);padding:30px}
